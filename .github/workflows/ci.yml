name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "gofmt required:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/dirspace-test.log
      - name: Test failure details
        if: failure()
        run: |
          {
            echo '### go test output'
            echo '```'
            tail -200 /tmp/dirspace-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message="$(grep -E '^(--- FAIL|FAIL|panic:|[^ ]+\.go:[0-9]+:)' /tmp/dirspace-test.log | head -40 | tr '\n' ' ' || true)"
          if [ -n "$message" ]; then
            echo "::error title=Go test failure::$message"
          fi
          detail="$(tail -60 /tmp/dirspace-test.log | tr '\n' ' ' || true)"
          if [ -n "$detail" ]; then
            echo "::error title=Go test tail::$detail"
          fi
      - name: Race test
        run: go test -race ./... -count=1
      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /tmp/dirspace-linux-amd64 ./cmd/dirspace
      - name: Build Linux arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/dirspace-linux-arm64 ./cmd/dirspace
