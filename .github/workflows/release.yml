name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          rm -rf dist
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-amd64 ./cmd/dirspace
          GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-arm64 ./cmd/dirspace
          for arch in amd64 arm64; do
            pkg="dirspace-${version}-linux-${arch}"
            root="${RUNNER_TEMP}/${pkg}"
            rm -rf "${root}"
            mkdir -p "${root}/bin" "${root}/configs" "${root}/deploy" "${root}/scripts"
            install -m 0755 "dist/dirspace-linux-${arch}" "${root}/bin/dirspace-linux-${arch}"
            install -m 0644 configs/config.yaml "${root}/configs/config.yaml"
            install -m 0644 deploy/dirspace.service "${root}/deploy/dirspace.service"
            install -m 0755 scripts/install.sh "${root}/scripts/install.sh"
            install -m 0644 README.md LICENSE "${root}/"
            tar -czf "dist/${pkg}.tar.gz" -C "${RUNNER_TEMP}" "${pkg}"
          done
          (cd dist && sha256sum * > dirspace-SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dirspace ${GITHUB_REF_NAME}" \
            --notes "Linux amd64/arm64 binaries and SHA256SUMS. New in 1.3: quick sampled estimates every 24h by default, weekly exact baseline, recursive parallel traversal, scan --new for new top-level dirs, stale-row hiding/pruning, auto memory limits and percentage-based systemd limits. 1.3.1 fixes live elapsed time in status and recovers abandoned scans after 90 seconds. 1.3.2 makes every profile default to automatic memory limits derived from cgroup/physical RAM. 1.3.3 resumes an interrupted exact run before any quick estimate after a restart. 1.3.4 fixes quick-mode byte accounting, adds partial staging output with full names, and shows completed-directory totals in status. 1.3.5 tracks all active worker directories so a slow top-level scan cannot be hidden by a faster worker that finished later. 1.3.6 resumes interrupted quick runs from their completed run_dirs instead of starting a fresh quick and deleting staging. 1.3.7 lets require_mount_point accept a subdirectory below a non-root mount, while still rejecting a fallback to the root filesystem. 1.4.0 adds a configurable depth-limited directory index (index_depth/index_top_k) and the children command for subdirectory drill-down; quick mode now walks subdirectories with a shared worker pool so one huge first-level directory no longer monopolizes the scan; and quick_max_files_per_top bounds a runaway directory and marks it partial instead of publishing a false exact total. 1.5.0 reports actual metadata QPS and the current limit in status, and replaces deterministic quick sampling with salted path-hash sampling, a per-directory census, and weighted estimates. Schema version 6. 1.5.1 gates every quick-scan metadata operation through the QPS throttle so observed QPS cannot exceed the configured limit. 1.6.0 makes partial a merged view: completed directories come from the active run and unfinished directories are carried from the last published result with per-row source and split totals, while top_dirs is still published atomically; --staging-only preserves the old behavior. 1.7.0 adds index_all_dirs for storing every directory aggregate and a size command for cached arbitrary-path queries; size --exact scans a missing subtree as its own root. 1.8.0 adds scan --shard i/n for disjoint subtree scans, merge for combining shard databases, fs-usage for statfs capacity, and batched dir_index writes. 1.8.1 makes interactive long scans detach automatically and makes the daemon reconcile schedules from the database with a filesystem-wide scan lock. 1.9.0 adds `dirspace monitor` for a one-screen process/host resource and effective-config check with high/low verdicts. 1.9.1 makes `status` show active child-root scans under the queried path and makes `monitor` inspect the actual child scan process instead of only the daemon. 1.9.2 makes `monitor` distinguish the active task's start-time QPS limit from a newly edited config, so an old task no longer looks like the new limit is broken. 1.9.3 records the live worker count and the task's initial QPS limit, so status/monitor can show active workers versus the config cap and separate adaptive throttling from a config change. 1.9.4 stops `partial` from presenting an interruption older than one hour as the current scan. 1.10.0 adds a shared global worker pool for exact scans, parallel quick file-metadata batches for large flat directories, configurable read_batch_size/quick_census_files, a 24h quick default, and a minimal default config. 1.11.0 enables the all-directory index by default, adds an optional children limit, and ships tarballs whose installer places config.yaml and dirspace.service automatically. 1.12.0 generalizes the product beyond NFS: filesystem-agnostic latency config names with legacy aliases, a cache-only diff command for growth reports, and generic mount/class display. 1.13.0 adds the auto profile, which chooses local/shared/FUSE baselines from the scan root filesystem while explicit performance keys still win. 1.13.1 fixes root filesystem mount detection, so auto no longer falls back to normal for paths such as /data when they live on /. 1.14.0 hot-reloads QPS, CPU, latency and concurrency from the config file for running scans: worker pools are sized for the maximum allowed concurrency, and a shared resizable semaphore lets reloads raise or lower actual concurrency without interrupting in-flight metadata calls. See README 1.14.1 also reloads the config file at scan start, so edits made while the daemon was idle apply to the next scan. 1.14.2 shows the active worker total and per-top-directory active worker counts in status (for example beegfs_meta×8). 1.15.0 makes partial show in-progress first-level directories with their current scanned bytes/files/dirs and an explicit 进行中 marker, adds a df-style filesystem total to the partial header, and merges live first-level directories into children while a scan is active. 1.15.1 adds a bounded live subdirectory index (index_depth up to 6, index_top_k, max 100k rows) so children can drill into completed subdirectories while a scan is still running. Schema version 9. 1.15.2 fixes auto-profile precedence: explicit performance max_metadata_qps, concurrency, CPU and latency keys in YAML now override the auto baseline instead of being silently replaced. 1.15.3 fixes the token bucket: short waits were rounded up to 1ms, silently capping QPS near 1000 even when max_metadata_qps was 4000; the bucket now keeps a small burst window and can sustain high configured rates. 1.15.4 keeps first-level directories marked 进行中 when the live subdirectory index also has a completed row for the same path. 1.15.5 falls back to the last completed run live snapshot when a resumed scan did not rebuild dir_index, so children still works after resume. 1.15.6 makes size --exact rescan an already-indexed directory instead of returning the cached entry, providing an on-demand fresh size for one subdirectory. 1.15.7 documents common subdirectory query commands in --help, including children --path, optional count, and size --exact. 1.15.8 shows the next scheduled exact and quick scan times in status, and uses generic example paths in help. for profiles, limits and shared-filesystem caveats."
