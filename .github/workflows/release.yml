name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-amd64 ./cmd/dirspace
          GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-arm64 ./cmd/dirspace
          (cd dist && sha256sum dirspace-linux-amd64 dirspace-linux-arm64 > dirspace-SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dirspace ${GITHUB_REF_NAME}" \
            --notes "Linux amd64/arm64 binaries and SHA256SUMS. New in 1.3: quick sampled estimates every 6h, weekly exact baseline, recursive parallel traversal, scan --new for new top-level dirs, stale-row hiding/pruning, auto memory limits and percentage-based systemd limits. 1.3.1 fixes live elapsed time in status and recovers abandoned scans after 90 seconds. 1.3.2 makes every profile default to automatic memory limits derived from cgroup/physical RAM. 1.3.3 resumes an interrupted exact run before any quick estimate after a restart. 1.3.4 fixes quick-mode byte accounting, adds partial staging output with full names, and shows completed-directory totals in status. See README for profiles, limits and shared-filesystem caveats."
