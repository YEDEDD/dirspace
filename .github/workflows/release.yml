name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-amd64 ./cmd/dirspace
          GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-arm64 ./cmd/dirspace
          (cd dist && sha256sum dirspace-linux-amd64 dirspace-linux-arm64 > dirspace-SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dirspace ${GITHUB_REF_NAME}" \
            --notes "Linux amd64/arm64 binaries and SHA256SUMS. New in 1.2: intra-directory file metadata workers and require_mount_point guard. See README for profiles, limits and NFS caveats."
