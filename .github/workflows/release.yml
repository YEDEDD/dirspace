name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-amd64 ./cmd/dirspace
          GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/YEDEDD/dirspace/internal/cli.Version=${version}" \
            -o dist/dirspace-linux-arm64 ./cmd/dirspace
          (cd dist && sha256sum dirspace-linux-amd64 dirspace-linux-arm64 > dirspace-SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dirspace ${GITHUB_REF_NAME}" \
            --notes "Linux amd64/arm64 binaries and SHA256SUMS. New in 1.3: quick sampled estimates every 6h, weekly exact baseline, recursive parallel traversal, scan --new for new top-level dirs, stale-row hiding/pruning, auto memory limits and percentage-based systemd limits. 1.3.1 fixes live elapsed time in status and recovers abandoned scans after 90 seconds. 1.3.2 makes every profile default to automatic memory limits derived from cgroup/physical RAM. 1.3.3 resumes an interrupted exact run before any quick estimate after a restart. 1.3.4 fixes quick-mode byte accounting, adds partial staging output with full names, and shows completed-directory totals in status. 1.3.5 tracks all active worker directories so a slow top-level scan cannot be hidden by a faster worker that finished later. 1.3.6 resumes interrupted quick runs from their completed run_dirs instead of starting a fresh quick and deleting staging. 1.3.7 lets require_mount_point accept a subdirectory below a non-root mount, while still rejecting a fallback to the root filesystem. 1.4.0 adds a configurable depth-limited directory index (index_depth/index_top_k) and the children command for subdirectory drill-down; quick mode now walks subdirectories with a shared worker pool so one huge first-level directory no longer monopolizes the scan; and quick_max_files_per_top bounds a runaway directory and marks it partial instead of publishing a false exact total. 1.5.0 reports actual metadata QPS and the current limit in status, and replaces deterministic quick sampling with salted path-hash sampling, a per-directory census, and weighted estimates. Schema version 6. 1.5.1 gates every quick-scan metadata operation through the QPS throttle so observed QPS cannot exceed the configured limit. 1.6.0 makes partial a merged view: completed directories come from the active run and unfinished directories are carried from the last published result with per-row source and split totals, while top_dirs is still published atomically; --staging-only preserves the old behavior. 1.7.0 adds index_all_dirs for storing every directory aggregate and a size command for cached arbitrary-path queries; size --exact scans a missing subtree as its own root. 1.8.0 adds scan --shard i/n for disjoint subtree scans, merge for combining shard databases, fs-usage for statfs capacity, and batched dir_index writes. 1.8.1 makes interactive long scans detach automatically and makes the daemon reconcile schedules from the database with a filesystem-wide scan lock. See README for profiles, limits and shared-filesystem caveats."
