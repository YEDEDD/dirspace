# dirspace 最小配置
#
# 日常只需要关心三件事：扫哪里、多久扫一次、对业务影响多大。
# 其余 QPS、CPU、内存、并发、NFS 阈值会根据 profile 自动推导。
#
# profile:
#   low    生产优先，QPS 上限 100，最多 4 个 worker
#   normal 默认，QPS 上限 300，最多 8 个 worker
#   fast   维护窗口，QPS 上限 1000，最多 16 个 worker
profile: normal

scan:
  root_path: /mnt
  # 每 24 小时刷新一次。每周一次可改为 168h。
  interval: 24h
  # 生产环境建议开启：挂载未就绪时拒绝扫描，避免误扫本地盘。
  require_mount_point: true

# 可选高级覆盖，通常不需要填写。填写后会覆盖 profile 中的同名值：
#
# database:
#   path: /var/lib/dirspace/usage.db
#   retention_days: 90
#
# scan:
#   size_basis: allocated       # allocated 或 logical
#   extra_roots: []             # 额外扫描根
#   scan_on_start: true
#   startup_delay: 15s
#   resume_interrupted: true
#   require_mount_point: false  # 扫描普通本地目录时可关闭
#
# performance:
#   concurrency: auto           # auto 或固定数字，例如 8
#   max_metadata_qps: 300
#   min_metadata_qps: 30
#   max_cpu_percent: 20
#   memory_limit: 512MB
#   adaptive_throttle: true
#   low_priority: true
#   sample_interval: 5s
#   max_host_cpu_percent: 85
#   max_load1: 0                # 0 表示关闭宿主机 load 检查
#   nfs_slow_latency: 500ms
#   nfs_pause_latency: 5s
#   nfs_pause_cooldown: 30s
#   max_metadata_errors: 8
#   progress_interval: 10s
#   heartbeat_interval: 5s
#
# logging:
#   level: info
#   format: text
